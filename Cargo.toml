[workspace]
resolver = "3"
members = ["crates/*"]
# Patched third-party crates (see vendor/README.md); not workspace members.
exclude = ["vendor"]

[workspace.package]
version = "0.4.1"
edition = "2024"
license = "AGPL-3.0-or-later"
rust-version = "1.88"
repository = "https://github.com/prep-cook/cooker"
homepage = "https://github.com/prep-cook/cooker"
# No crate is published to crates.io.
publish = false
categories = ["network-programming", "web-programming"]
# The Go reference recordings and fixtures stay in the repository; a published crate
# only needs to build.
exclude = ["tests/"]

[workspace.dependencies]
# A release bumps the versions with workspace.package.version.
ck-stream = { path = "crates/ck-stream", version = "0.4.1" }
ck-wire = { path = "crates/ck-wire", version = "0.4.1" }
ck-core = { path = "crates/ck-core", version = "0.4.1" }
ck-exec = { path = "crates/ck-exec", version = "0.4.1" }
ck-server = { path = "crates/ck-server", version = "0.4.1" }
ck-translate = { path = "crates/ck-translate", version = "0.4.1" }

anyhow = "1"
axum = "0.8.9"
bytes = "1"
clap = { version = "4", features = ["derive"] }
futures-util = "0.3"
http = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml_ng = "0.10"
socket2 = "0.6"
tokio = { version = "1.53", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
wreq = { version = "6.0.0-rc.31", features = ["stream", "json"] }

# Test builds only, two leaf crates: unoptimized, memchr's SIMD search (the Gemini schema
# goldens) and bcrypt's Blowfish rounds (every management key hash) took most of the
# slowest Go comparison tests' time. Debug assertions and overflow checks stay on, and the
# workspace's own crates, whose stack depth some tests bound, stay unoptimized.
[profile.test.package.memchr]
opt-level = 3

[profile.test.package.blowfish]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# gjson 0.8.1 with SIMD string scanning; behaviour unchanged (vendor/README.md). A patch
# applies to this workspace only: a build from crates.io uses upstream gjson 0.8.1.
[patch.crates-io]
gjson = { path = "vendor/gjson" }
