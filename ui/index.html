<!doctype html>
<html lang="en" data-astryx-theme="site-neutral">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <!-- The dashboard has its own dark theme; tell Dark Reader not to filter it again. -->
    <meta name="darkreader-lock" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>cook-router</title>
    <!-- The Figtree faces every first screen draws (src/themes/site/index.ts), fetched with the
         entry instead of after the stylesheet and the first render ask for them. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/figtree/files/figtree-latin-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/figtree/files/figtree-latin-500-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/figtree/files/figtree-latin-600-normal.woff2" />
    <!-- Before first paint: the stored theme, palette and language (src/app/preferences.ts), else
         the system's and the default palette. -->
    <script>
      (function () {
        var root = document.documentElement, mode = null, palette = null, locale = null;
        try {
          mode = localStorage.getItem("cook-router-theme");
          palette = localStorage.getItem("cook-router-palette");
          locale = localStorage.getItem("cook-router-locale");
        } catch (e) {}
        if (mode === "light" || mode === "dark") root.dataset.theme = mode;
        // Any stored palette but the default (Neutral, stored as nothing; a "neutral" kept from
        // before it was the default counts as nothing too); initialPalette()
        // (src/app/preferences.ts) keeps only a known one.
        if (palette && palette !== "neutral") root.dataset.palette = palette;
        if (locale !== "en" && locale !== "zh-CN" && locale !== "zh-TW") {
          locale = "en";
          var asked = navigator.languages || [];
          for (var i = 0; i < asked.length; i++) {
            var tag = asked[i].toLowerCase();
            if (tag.indexOf("en") === 0) break;
            if (tag.indexOf("zh") === 0) {
              locale = /^zh-(hant|tw|hk|mo)\b/.test(tag) ? "zh-TW" : "zh-CN";
              break;
            }
          }
        }
        root.lang = locale;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
