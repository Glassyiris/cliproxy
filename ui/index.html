<!doctype html>
<html lang="en" data-astryx-theme="site">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>cliproxy-rs</title>
    <!-- Before first paint: the stored theme and language (src/app/preferences.ts), else the system's. -->
    <script>
      (function () {
        var root = document.documentElement, mode = null, locale = null;
        try {
          mode = localStorage.getItem("cliproxy-theme");
          locale = localStorage.getItem("cliproxy-locale");
        } catch (e) {}
        if (mode === "light" || mode === "dark") root.dataset.theme = mode;
        if (locale !== "en" && locale !== "zh-CN" && locale !== "zh-TW") {
          locale = "en";
          var asked = navigator.languages || [];
          for (var i = 0; i < asked.length; i++) {
            var tag = asked[i].toLowerCase();
            if (tag.indexOf("en") === 0) break;
            if (tag.indexOf("zh") === 0) {
              locale = /^zh-(hant|tw|hk|mo)\b/.test(tag) ? "zh-TW" : "zh-CN";
              break;
            }
          }
        }
        root.lang = locale;
      })();
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
