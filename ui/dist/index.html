    <!-- Before first paint: the stored theme, palette and language (src/app/preferences.ts), else
         the system's and the default palette. -->
    <script>
      (function () {
        var root = document.documentElement, mode = null, palette = null, locale = null;
        try {
          mode = localStorage.getItem("cliproxy-theme");
          palette = localStorage.getItem("cliproxy-palette");
          locale = localStorage.getItem("cliproxy-locale");
        } catch (e) {}
        if (mode === "light" || mode === "dark") root.dataset.theme = mode;
        if (palette === "main") root.dataset.palette = palette;
        if (locale !== "en" && locale !== "zh-CN" && locale !== "zh-TW") {
          locale = "en";
          var asked = navigator.languages || [];
          for (var i = 0; i < asked.length; i++) {
            var tag = asked[i].toLowerCase();
            if (tag.indexOf("en") === 0) break;
            if (tag.indexOf("zh") === 0) {
              locale = /^zh-(hant|tw|hk|mo)\b/.test(tag) ? "zh-TW" : "zh-CN";
              break;
            }
          }
        }
        root.lang = locale;
      })();
    </script>
