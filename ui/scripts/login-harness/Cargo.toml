# Test tool, not shipped: cooker with every provider login endpoint pointed at a local fake.
[package]
name = "login-harness"
version = "0.0.0"
edition = "2024"
publish = false

[workspace]

[dependencies]
anyhow = "1"
axum = "0.8.9"
tokio = { version = "1.53", features = ["full"] }
ck-core = { path = "../../../crates/ck-core" }
ck-exec = { path = "../../../crates/ck-exec" }
ck-server = { path = "../../../crates/ck-server", features = ["testing"] }
