# Every check is a stage of the Dockerfile, and each job builds one of them with
# `docker buildx build --target <stage>`, the same command as locally: the dashboard's checks,
# fmt/clippy/actionlint/notices/harness and the script tests (check), the workspace tests in
# two shards (test), and the size and idle gates on the release binary followed by the image's
# smoke test and size gate (perf). The requirements job builds the requirements stage
# (REQUIREMENTS.md against the rule files) on every run, whatever changed.
# Every push to master, every manual run and the call from release.yml (so a tagged release
# runs the same checks before it builds anything) run all of them. A pull request runs the
# lanes its changed paths can affect (.github/scripts/ci-lanes.py, which lists the rules);
# the label ci:full, followed by a re-run, runs every lane. The ci-ok job passes when every
# selected lane passed and every other lane was skipped. master requires no check for now.
# One run per change: pushes to master, and pull requests through `pull_request` only. Runs
# are grouped per pull request (or per ref outside one), and a newer push cancels the older
# run.
# Layer caches live in the Actions cache, one scope per stage, written by pushes to master
# only. The fetched crates and Go modules are a layer (the Dockerfile's fetch stage), so a run
# that restores it builds offline. Cargo's target directories are BuildKit cache mounts, which
# the Actions cache does not keep, so each run compiles the workspace again.
name: CI

on:
  push:
    branches: [master]
  # Not on `labeled`: Dependabot adds two labels as it opens a pull request, and each label
  # event started a run that cancelled the one before it, leaving a failed ci-ok behind.
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-ci
  cancel-in-progress: true

jobs:
  # Which lanes this run needs. Its own tests run first, so a pull request that changes the
  # rules is selected by rules that pass them. If this job fails, every lane runs and ci-ok
  # fails.
  changes:
    name: lanes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # Reads the pull request's current labels (ci:full).
    permissions:
      contents: read
      pull-requests: read
    outputs:
      lanes: ${{ steps.select.outputs.lanes }}
      dashboard: ${{ steps.select.outputs.dashboard }}
      check: ${{ steps.select.outputs.check }}
      test: ${{ steps.select.outputs.test }}
      perf: ${{ steps.select.outputs.perf }}
    steps:
      # The test merge commit and its first parent, the base branch tip.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Selector tests
        run: python3 -m unittest discover -s .github/scripts -p 'test_ci_lanes*.py'
      - name: Select lanes
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/ci-lanes.py

  # REQUIREMENTS.md against the rule files and its tests: every rule group has a filled
  # Enforcement row, and no deferral has expired. A Due date can pass with no change at all,
  # so this runs on every run instead of in a lane; ci-ok fails when it does. The stage reads
  # files only and builds in seconds, so it keeps no layer cache.
  requirements:
    name: requirements check
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: requirements
          build-args: CI_COMMIT=${{ github.sha }}

  dashboard:
    name: dashboard
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.dashboard == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: dashboard
          cache-from: type=gha,scope=dashboard
          cache-to: ${{ github.ref == 'refs/heads/master' && 'type=gha,mode=max,scope=dashboard' || '' }}

  check:
    name: fmt, clippy, actionlint, notices, harness, requirements
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.check == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: check
          cache-from: type=gha,scope=check
          cache-to: ${{ github.ref == 'refs/heads/master' && 'type=gha,mode=max,scope=check' || '' }}

  # The workspace tests in two shards on two runners, each building the tests itself
  # (building once and copying the binaries took longer than building again). Nextest
  # assigns every test to exactly one shard by a hash of its name; the counts job below
  # checks that the shards together ran every test that `cargo nextest list` lists.
  test:
    name: tests (shard ${{ matrix.shard }} of 2)
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.test == 'true') }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # Each shard sets only its own output; an empty output does not replace another leg's
    # value. Outputs rather than artifacts, because release.yml calls this workflow.
    outputs:
      counts-1: ${{ steps.counts.outputs.counts-1 }}
      counts-2: ${{ steps.counts.outputs.counts-2 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # test-report holds the shard's nextest list, log and counts; the test stage fails the
      # build when a test fails or the shard did not run exactly its partition.
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: test-report
          build-args: |
            SHARD=${{ matrix.shard }}
            SHARDS=2
            CI_COMMIT=${{ github.sha }}
          outputs: type=local,dest=${{ runner.temp }}/test-report
          provenance: false
          sbom: false
          cache-from: type=gha,scope=test
          cache-to: ${{ github.ref == 'refs/heads/master' && matrix.shard == 1 && 'type=gha,mode=max,scope=test' || '' }}
      - name: Test counts
        id: counts
        env:
          SHARD: ${{ matrix.shard }}
        run: echo "counts-$SHARD=$(cat "$RUNNER_TEMP/test-report/counts-$SHARD.json")" >> "$GITHUB_OUTPUT"

  # The whole suite's counts: nextest's tests from both shards, which must add up to every
  # test in the list that is not ignored, and cargo test's result lines; nextest's ignored
  # tests count as ignored.
  test-counts:
    name: test counts
    needs: test
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: .github/scripts
      - name: Test counts
        env:
          COUNTS_1: ${{ needs.test.outputs.counts-1 }}
          COUNTS_2: ${{ needs.test.outputs.counts-2 }}
        run: |
          printf '%s\n' "$COUNTS_1" > counts-1.json
          printf '%s\n' "$COUNTS_2" > counts-2.json
          python3 .github/scripts/test-counts.py total counts-1.json counts-2.json

  # The size gate and both idle gates run one after another in the perf stage, so no build
  # competes with an idle window. The image is built from the same binary, then started once
  # and measured against its size budget.
  perf:
    name: size and idle gates, image
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.perf == 'true') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Size and idle gates
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: perf
          build-args: CI_COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=perf
          cache-to: ${{ github.ref == 'refs/heads/master' && 'type=gha,mode=max,scope=perf' || '' }}
      - name: Image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          tags: cook-router:ci
          cache-from: type=gha,scope=perf
      - name: Smoke test
        run: docker run --rm cook-router:ci --version
      - name: Image size gate
        run: bench/gate.sh image cook-router:ci

  ci-ok:
    needs: [changes, requirements, dashboard, check, test, test-counts, perf]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Selected lanes passed, the others skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json, os, sys
          needs = json.loads(os.environ["NEEDS"])
          jobs = {"dashboard": ["dashboard"], "check": ["check"], "test": ["test", "test-counts"],
                  "perf": ["perf"]}
          ok = needs["changes"]["result"] == "success"
          selected = set(json.loads(needs["changes"]["outputs"].get("lanes") or "null") or []) if ok else set()
          ok &= needs["requirements"]["result"] == "success"
          rows = [f"| changes | lane selection | {needs['changes']['result']} | success |",
                  f"| requirements | every run | {needs['requirements']['result']} | success |"]
          for lane, names in jobs.items():
              want = "success" if lane in selected else "skipped"
              for name in names:
                  got = needs[name]["result"]
                  ok &= got == want
                  rows.append(f"| {name} | {lane} | {got} | {want} |")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as out:
              out.write("### CI result\n\n| Job | Lane | Result | Expected |\n| --- | --- | --- | --- |\n")
              out.write("\n".join(rows) + "\n")
          print("\n".join(rows))
          if not ok:
              print("::error::A selected lane did not pass, or an unselected lane did not skip")
              sys.exit(1)
          PY
