# The size report comment (.github/ci/report/README.md): after each CI run of a pull
# request, the sizes it measured next to master's and the ceilings, in one comment per pull
# request that every later run updates.
# workflow_run runs this file and the renderer from the default branch, with a token that
# can write pull requests even for a fork's. The pull request's run supplies data only: its
# artifacts are checked for name, size and shape, read as JSON, and never executed.
name: Size report

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions: {}

concurrency:
  group: size-report-${{ github.event.workflow_run.head_sha }}

jobs:
  report:
    # A cancelled run was replaced by a newer push, whose run reports.
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      pull-requests: write
    steps:
      - name: Check out the trusted renderer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/ci/report

      - name: Collect the metrics and render
        id: render
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          RUN_URL: ${{ github.event.workflow_run.html_url }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          CREATED_AT: ${{ github.event.workflow_run.created_at }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/size-report-$RUN_ID-$RUN_ATTEMPT"
          mkdir -p "$root/candidate" "$root/baseline"

          # The newest ci-report-<lane> artifact of a run, each a zip of exactly <lane>.json
          # of at most 256 KiB. A rejected artifact leaves a marker the renderer lists.
          download() { # run_id destination
            local run=$1 out=$2 id size name index=0
            gh api "repos/$REPO/actions/runs/$run/artifacts?per_page=100" --paginate --slurp \
              > "$root/artifacts-$run.json"
            jq -r '[.[] | .artifacts[] | select(.name | startswith("ci-report-")) | select(.expired == false)]
                   | sort_by([.name, .created_at, .id]) | group_by(.name) | map(last) | .[:16][]
                   | [.id, .size_in_bytes, .name] | @tsv' "$root/artifacts-$run.json" > "$root/list-$run"
            while IFS=$'\t' read -r id size name; do
              index=$((index + 1))
              if [[ ! $id =~ ^[0-9]+$ || ! $size =~ ^[0-9]+$ || ! $name =~ ^ci-report-[a-z0-9][a-z0-9-]{0,39}$ ]]; then
                printf '%s\n' '{"artifact_validation_error":"invalid artifact name or metadata"}' \
                  > "$out/invalid-$run-$index.json"
                continue
              fi
              if ((size > 1024 * 1024)); then
                printf '%s\n' '{"artifact_validation_error":"report artifact exceeds 1 MiB"}' \
                  > "$out/invalid-$run-$index.json"
                continue
              fi
              gh api "repos/$REPO/actions/artifacts/$id/zip" > "$root/artifact-$run-$index.zip"
              python3 -I - "$root/artifact-$run-$index.zip" "$out" "${name#ci-report-}.json" "invalid-$run-$index.json" <<'PY'
          import json
          import sys
          import zipfile
          from pathlib import Path, PurePosixPath

          archive, out, expected, marker = Path(sys.argv[1]), Path(sys.argv[2]), sys.argv[3], sys.argv[4]
          try:
              if archive.stat().st_size > 1024 * 1024:
                  raise ValueError("report artifact archive exceeds 1 MiB")
              with zipfile.ZipFile(archive) as source:
                  members = [member for member in source.infolist() if not member.is_dir()]
                  if len(members) != 1:
                      raise ValueError("report artifact must hold exactly one file")
                  member = members[0]
                  if PurePosixPath(member.filename).name != expected or member.file_size > 256 * 1024:
                      raise ValueError("report artifact holds an unexpected file")
                  payload = source.read(member)
              if len(payload) > 256 * 1024:
                  raise ValueError("report JSON expands beyond 256 KiB")
              with (out / expected).open("xb") as target:
                  target.write(payload)
          except (OSError, ValueError, zipfile.BadZipFile) as error:
              (out / marker).write_text(json.dumps({"artifact_validation_error": str(error)}) + "\n")
          PY
            done < "$root/list-$run"
          }

          download "$RUN_ID" "$root/candidate"
          # The newest attempt of each job up to this run's attempt.
          gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=all&per_page=100" --paginate --slurp \
            > "$root/jobs-pages.json"
          jq --argjson attempt "$RUN_ATTEMPT" '
            [.[] | .jobs[] | select(.run_attempt <= $attempt)] | sort_by(.run_attempt)
            | map({key: .name, value: .conclusion}) | from_entries' "$root/jobs-pages.json" > "$root/jobs.json"

          # The baseline: the latest successful CI run of a push to the default branch that
          # was created before this run.
          gh api "repos/$REPO/actions/workflows/ci.yml/runs?branch=$DEFAULT_BRANCH&event=push&status=success&per_page=50" \
            > "$root/baseline-runs.json"
          jq --argjson id "$RUN_ID" --arg created "$CREATED_AT" '
            [.workflow_runs[] | select(.id != $id and .created_at < $created)]
            | sort_by(.created_at) | last' "$root/baseline-runs.json" > "$root/baseline-run.json"
          baseline_id=$(jq -r '.id // empty' "$root/baseline-run.json")
          if [[ -n $baseline_id ]]; then
            [[ $baseline_id =~ ^[0-9]+$ ]]
            download "$baseline_id" "$root/baseline"
          fi

          jq -n --arg head "$HEAD_SHA" --arg base "$DEFAULT_BRANCH" --arg url "$RUN_URL" \
            --slurpfile run "$root/baseline-run.json" --slurpfile jobs "$root/jobs.json" \
            --argjson reports "$(find "$root/baseline" -name '*.json' ! -name 'invalid-*' | wc -l)" '
            {head_sha: $head, base: $base, run_url: $url, jobs: $jobs[0],
             baseline: (if $run[0] == null then {reason: "no successful CI run of a push to \($base) before this run"}
                        elif $reports == 0 then {reason: "the baseline run has no size report, or it expired"}
                        else {sha: $run[0].head_sha, run_id: $run[0].id} end)}' > "$root/context.json"

          python3 -I .github/ci/report/render.py --candidate "$root/candidate" --baseline "$root/baseline" \
            --context "$root/context.json" --out "$root/body.md"
          (($(wc -c < "$root/body.md") <= 60000))
          echo "root=$root" >> "$GITHUB_OUTPUT"

      - name: Create or update the comment on each open pull request of this head
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          ROOT: ${{ steps.render.outputs.root }}
        run: |
          set -euo pipefail
          marker='<!-- cliproxy-size-report -->'
          # A fork's run lists no pull requests in the event, so they are found by head.
          gh api "repos/$REPO/pulls?state=open&per_page=100" --paginate --slurp > "$ROOT/pulls.json"
          jq -r --arg sha "$HEAD_SHA" --arg repo "$REPO" '
            .[][] | select(.head.sha == $sha and .base.repo.full_name == $repo) | .number
          ' "$ROOT/pulls.json" > "$ROOT/pull-numbers"
          while read -r pr; do
            [[ $pr =~ ^[0-9]+$ ]]
            gh api "repos/$REPO/issues/$pr/comments?per_page=100" --paginate --slurp > "$ROOT/comments-$pr.json"
            comment=$(jq -r --arg marker "$marker" '
              [.[][] | select(.user.login == "github-actions[bot]") | select(.body | contains($marker))]
              | .[0].id // empty' "$ROOT/comments-$pr.json")
            if [[ -n $comment ]]; then
              gh api -X PATCH "repos/$REPO/issues/comments/$comment" -F body=@"$ROOT/body.md" > /dev/null
            else
              gh api "repos/$REPO/issues/$pr/comments" -F body=@"$ROOT/body.md" > /dev/null
            fi
          done < "$ROOT/pull-numbers"
