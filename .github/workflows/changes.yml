# Validates the changelog fragments a pull request adds and requires one when it touches
# shipped code (rules: changes/README.md), and checks the pull request title, which becomes
# the squash commit's subject (CONTRIBUTING.md). It reruns when a label or the title
# changes, so adding `no-changelog` or fixing the title clears a failure without a new
# push. Kept apart from ci.yml so neither restarts the build and test jobs. Both read the
# pull request (its title, labels and the history back to the merge base), which a Docker
# build does not see, so they run here; the tests of both scripts run in the Dockerfile's
# check stage.
name: Changes

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, labeled, unlabeled]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  fragments:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # The check needs the merge base of the pull request, so fetch full history.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Validate fragments and require one for shipped paths
        run: python3 -I tools/changelog.py check

  title:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the pull request title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: python3 -I .github/scripts/pr-title.py
