# Publishes the image to GitHub Packages (ghcr.io/prep-cook/cook-router) for linux/amd64 and
# linux/arm64. The image is the only release artifact.
#
# Pushing a tag such as v0.1.0 runs every CI lane, builds the Dockerfile's runtime stage on a
# native runner per architecture, checks that the binary reports the tag's version, pushes
# the result as the release candidate <version>-rc, and creates a draft GitHub release.
# Publishing needs Vayun's approval (AGENTS.md, Rule priority); after it, a maintainer runs
# this workflow by hand with the tag, which points <version> (and `latest`, unless the
# version is a pre-release) at the candidate's images and publishes the draft. Nothing is
# rebuilt between the candidate and the release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag whose approved release candidate to publish, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/prep-cook/cook-router

jobs:
  # Every lane of ci.yml: a call from a tag push selects all of them.
  test:
    name: CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  image:
    name: image ${{ matrix.arch }}
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          tags: cook-router:release
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.arch }}
      # The first line is Go's startup banner; the last is "cook-router <version>".
      - name: Version matches the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          reported="$(docker run --rm cook-router:release --version | tail -n 1)"
          echo "$reported"
          if [[ "$reported" != "cook-router $version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the binary version ($reported)"
            exit 1
          fi
      # bench/budgets.txt holds one image budget, measured on amd64; arm64 is reported only.
      - name: Image size gate
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if [[ "$ARCH" == amd64 ]]; then
            bench/gate.sh image cook-router:release
          else
            echo "image gzip bytes ($ARCH): $(docker save cook-router:release | gzip -c | wc -c)"
          fi
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the release candidate
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          tag="$IMAGE:${GITHUB_REF_NAME#v}-rc-$ARCH"
          docker tag cook-router:release "$tag"
          docker push "$tag"

  candidate:
    name: release candidate and draft release
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Multi-architecture candidate
        run: |
          rc="$IMAGE:${GITHUB_REF_NAME#v}-rc"
          docker buildx imagetools create -t "$rc" "$rc-amd64" "$rc-arm64"
          docker buildx imagetools inspect "$rc"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes --draft

  # Run by hand after Vayun approves the draft release and its candidate.
  publish:
    name: publish ${{ inputs.tag }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - name: Tag and draft exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$TAG is not a release tag such as v0.1.0"; exit 1
          fi
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [[ "$draft" != true ]]; then
            echo "::error::$TAG has no draft release to publish"; exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Point the release tags at the candidate
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="${TAG#v}"
          tags=(-t "$IMAGE:$version")
          [[ "$version" == *-* ]] || tags+=(-t "$IMAGE:latest")
          docker buildx imagetools create "${tags[@]}" "$IMAGE:$version-rc"
          docker buildx imagetools inspect "$IMAGE:$version"
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
