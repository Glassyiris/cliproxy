# Publishes the image to GitHub Packages (ghcr.io/prep-cook/cooker) for linux/amd64 and
# linux/arm64. The image is the only release artifact.
#
# Pushing a tag such as v0.1.0 runs every CI lane, builds the Dockerfile's runtime stage on a
# native runner per architecture, checks that the binary reports the tag's version, pushes
# the result as the release candidate candidate-<version>-<commit>, and creates a draft GitHub
# release that records the candidate's digest and commit. No release tag (<version>, latest)
# starts with `candidate-`, and the full commit hash ends every candidate tag, so a candidate
# never shares a tag with a release or with another version's candidate.
# Publishing needs Vayun's approval (AGENTS.md, Rule priority); after it, a maintainer runs
# this workflow by hand with the tag. It reads the digest from the draft, checks that the tag
# still points at the recorded commit and that the image reports the tag's version, points
# <version> (and `latest`, unless the version is a pre-release) at that digest and publishes
# the draft. Nothing is rebuilt between the candidate and the release.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Tag whose approved release candidate to publish, such as v0.1.0
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/prep-cook/cooker

jobs:
  # Every lane of ci.yml: a call from a tag push selects all of them.
  test:
    name: CI
    if: github.event_name == 'push'
    uses: ./.github/workflows/ci.yml

  image:
    name: image ${{ matrix.arch }}
    needs: test
    strategy:
      fail-fast: true
      matrix:
        include:
          - { arch: amd64, os: ubuntu-24.04 }
          - { arch: arm64, os: ubuntu-24.04-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build information
        id: build-info
        run: |
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u -d "@$(git show -s --format=%ct HEAD)" +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          target: runtime
          load: true
          tags: cooker:release
          build-args: |
            CK_COMMIT=${{ steps.build-info.outputs.commit }}
            CK_BUILD_DATE=${{ steps.build-info.outputs.date }}
          cache-from: type=gha,scope=runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=runtime-${{ matrix.arch }}
      # The first line is Go's startup banner; the last is "cooker <version>".
      - name: Version matches the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          reported="$(docker run --rm cooker:release --version | tail -n 1)"
          echo "$reported"
          if [[ "$reported" != "cooker $version" ]]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the binary version ($reported)"
            exit 1
          fi
      # bench/budgets.txt holds one image budget, measured on amd64; arm64 is reported only.
      - name: Image size gate
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          if [[ "$ARCH" == amd64 ]]; then
            bench/gate.sh image cooker:release
          else
            echo "image gzip bytes ($ARCH): $(docker save cooker:release | gzip -c | wc -c)"
          fi
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Push the release candidate
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          tag="$IMAGE:candidate-${GITHUB_REF_NAME#v}-$GITHUB_SHA-$ARCH"
          docker tag cooker:release "$tag"
          docker push "$tag"

  candidate:
    name: release candidate and draft release
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Multi-architecture candidate
        id: candidate
        run: |
          candidate="$IMAGE:candidate-${GITHUB_REF_NAME#v}-$GITHUB_SHA"
          docker buildx imagetools create -t "$candidate" "$candidate-amd64" "$candidate-arm64"
          docker buildx imagetools inspect "$candidate"
          digest="$(docker buildx imagetools inspect "$candidate" --format '{{json .Manifest}}' | jq -r .digest)"
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            echo "::error::no digest for $candidate ($digest)"; exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      # The publish run takes the candidate from this line, by digest, so a later push to any
      # tag cannot change what it publishes. gh puts the generated notes after it.
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" \
            --notes "Image candidate: $IMAGE@$DIGEST, built from $GITHUB_SHA"$'\n' --generate-notes --draft

  # Run by hand after Vayun approves the draft release and its candidate.
  publish:
    name: publish ${{ inputs.tag }}
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      packages: write
    steps:
      - name: Tag and draft exist
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::$TAG is not a release tag such as v0.1.0"; exit 1
          fi
          draft="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)"
          if [[ "$draft" != true ]]; then
            echo "::error::$TAG has no draft release to publish"; exit 1
          fi
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      # The candidate the draft records, which must come from the commit the tag points at now
      # and report the tag's version. The runner is amd64; the image job ran both
      # architectures' binaries before the candidate existed, and the digest covers both.
      - name: Candidate matches the tag
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          line="$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body \
            | tr -d '\r' | grep -m 1 '^Image candidate: ' || true)"
          pattern='^Image candidate: ([^ @]+)@(sha256:[0-9a-f]{64}), built from ([0-9a-f]{40})$'
          if [[ ! "$line" =~ $pattern ]]; then
            echo "::error::the draft release of $TAG records no image candidate"; exit 1
          fi
          image="${BASH_REMATCH[1]}" digest="${BASH_REMATCH[2]}" commit="${BASH_REMATCH[3]}"
          if [[ "$image" != "$IMAGE" ]]; then
            echo "::error::the candidate $image is not $IMAGE"; exit 1
          fi
          tagged="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          if [[ "$tagged" != "$commit" ]]; then
            echo "::error::$TAG points at $tagged, the candidate was built from $commit"; exit 1
          fi
          reported="$(docker run --rm "$IMAGE@$digest" --version | tail -n 1)"
          echo "$reported"
          if [[ "$reported" != "cooker ${TAG#v}" ]]; then
            echo "::error::$TAG does not match the candidate's version ($reported)"; exit 1
          fi
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
      - name: Point the release tags at the candidate
        env:
          TAG: ${{ inputs.tag }}
          DIGEST: ${{ steps.candidate.outputs.digest }}
        run: |
          version="${TAG#v}"
          tags=(-t "$IMAGE:$version")
          [[ "$version" == *-* ]] || tags+=(-t "$IMAGE:latest")
          docker buildx imagetools create "${tags[@]}" "$IMAGE@$DIGEST"
          docker buildx imagetools inspect "$IMAGE:$version"
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false
