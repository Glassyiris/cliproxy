name: 功能请求（简体中文）
description: 请求 CLIProxyAPI 中缺少的功能，或提出新功能。
title: 'feature: '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: AI 可以协助撰写请求，但不得提交未经核实的内容。
  - type: textarea
    id: want
    attributes:
      label: 你想做什么
      description: 说明你要完成的任务，以及目前的阻碍。
    validations:
      required: true
  - type: dropdown
    id: parity
    attributes:
      label: CLIProxyAPI 是否已有此功能？
      options:
        - 是，这是 cook-router 缺少的 CLIProxyAPI 功能
        - 否，这是新功能
        - 不清楚
  - type: textarea
    id: idea
    attributes:
      label: 可能的实现方式
      description: 选填。说明你设想的设置、路由或仪表盘改动。
  - type: input
    id: owner
    attributes:
      label: 实际负责人
      description: 填写你的 GitHub 用户名。你须核实请求并参与讨论；AI 无法代答。
      placeholder: '@your-name'
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      description: 仅勾选真实陈述。虚假勾选会导致此议题被关闭。
      options:
        - label: 我已检索现有议题和拉取请求，未发现相同请求。
          required: true
        - label: 我未阅读上述选项就勾选了它们。
        - label: 我是 AI 代理，此内容未经人工审核便已提交。
