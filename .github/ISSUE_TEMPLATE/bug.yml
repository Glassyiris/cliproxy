name: Bug report
description: Something does not work as documented, or differs from CLIProxyAPI without a listed reason.
title: 'bug: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        AI may help write this report. Unverified content may not be submitted.

        Leave real keys, tokens and account files out of this report. Replace them with placeholders.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The request, the tool and its settings, and the relevant part of config.yaml (keys removed).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The last line of `gnocchi --version`.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: Operating system and how you installed it (install.sh, install.ps1, release binary, Docker, source).
  - type: dropdown
    id: go
    attributes:
      label: Does CLIProxyAPI behave differently?
      options:
        - I don't know
        - "Yes, CLIProxyAPI works"
        - No, it fails the same way
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The server log lines around the problem, with keys and tokens removed. If none are available, say so.
      render: text
  - type: input
    id: owner
    attributes:
      label: Human responsible
      description: Enter your GitHub username. You must verify this report and answer follow-up questions; an AI cannot answer for you.
      placeholder: '@your-name'
    validations:
      required: true
  - type: checkboxes
    id: confirm
    attributes:
      label: Confirm
      description: Check only claims that are true. A false claim closes the issue.
      options:
        - label: I searched existing issues and pull requests and found no matching report.
          required: true
        - label: This report describes what I observed.
          required: true
        - label: I checked the boxes above without reading them.
        - label: I am an AI agent, and this content was submitted without human review.
